<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sensus AKP & Taksasi Panen</title>
<style>
  :root{
    --bg: #ffffff;
    --panel: #f6f0ef;
    --line: #e0d3d1;
    --ink: #1a1a17;
    --dim: #7a6b69;
    --tbs: #b3231a;
    --tbs-dim: #f7dedb;
    --green: #4a7a2e;
    --green-dim: #e6f0de;
    --danger: #8c1a12;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Calibri','Segoe UI',ui-sans-serif,sans-serif;
    overflow-x:hidden;height:100%;}
  body{display:flex;flex-direction:column;min-height:100vh;padding-bottom:16px;}
  .screen{display:none;flex:1;flex-direction:column;}
  .screen.active{display:flex;}

  /* ===== HEADER ===== */
  header{
    padding:14px 16px 10px;
    border-bottom:2px solid var(--line);
    flex-shrink:0;
    display:flex;
    align-items:center;
    gap:12px;
  }
  header .logo-wrap{flex-shrink:0;}
  header .logo-wrap img{height:44px;display:block;}
  header .header-text{flex:1;min-width:0;}
  h1{font-size:22px;letter-spacing:0.5px;margin:0;font-weight:700;color:var(--tbs);}
  .estate-name{font-size:15px;font-weight:700;color:var(--ink);margin-top:2px;}
  .backrow{display:flex;align-items:center;gap:10px;margin-bottom:4px;}
  .backbtn{
    background:none;border:none;font-size:22px;color:var(--dim);padding:2px 8px 2px 0;font-weight:700;
  }
  .screen-title{font-size:19px;font-weight:700;color:var(--ink);}

  main{flex:1;display:flex;flex-direction:column;padding:16px;overflow-y:auto;}

  /* ===== BUTTONS ===== */
  .btn{
    display:block;width:100%;padding:18px 0;border-radius:12px;border:none;
    font-family:inherit;font-size:18px;font-weight:700;letter-spacing:0.3px;
    margin-bottom:12px;text-align:center;text-decoration:none;
  }
  .btn-primary{background:var(--tbs);color:#fff;}
  .btn-primary:active{background:#8c1a12;}
  .btn-secondary{background:var(--panel);color:var(--ink);border:1.5px solid var(--line);}
  .btn-secondary:active{background:var(--line);}
  .btn-outline{background:transparent;color:var(--dim);border:1.5px solid var(--line);}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-small{padding:12px 0;font-size:14px;}
  .btn-link{background:none;border:none;color:var(--dim);font-family:inherit;font-size:14px;text-decoration:underline;padding:10px 0;}

  /* ===== HOME SCREEN ===== */
  #screen-home main{justify-content:flex-start;padding-top:24px;}
  .resume-card{
    background:var(--tbs-dim);border:1.5px solid var(--tbs);border-radius:12px;
    padding:16px;margin-bottom:20px;
  }
  .resume-card .k{font-size:13px;color:var(--tbs);font-weight:700;letter-spacing:0.5px;}
  .resume-card .v{font-size:17px;font-weight:700;color:var(--ink);margin-top:4px;}
  .resume-card .p{font-size:14px;color:var(--dim);margin-top:2px;}

  /* ===== FORM ELEMENTS ===== */
  .field-group{margin-bottom:18px;}
  .field-label{font-size:15px;font-weight:700;color:var(--dim);margin-bottom:6px;display:block;}
  select, input[type="date"], input[type="number"], input[type="text"]{
    width:100%;padding:14px 12px;font-size:18px;font-family:inherit;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
  }
  select:focus, input:focus{outline:2px solid var(--tbs);border-color:var(--tbs);}
  .field-info{
    display:flex;gap:10px;margin-top:10px;
  }
  .info-chip{
    flex:1;background:var(--panel);border:1px solid var(--line);border-radius:8px;
    padding:10px;text-align:center;
  }
  .info-chip .k{font-size:11px;color:var(--dim);letter-spacing:0.5px;font-weight:700;}
  .info-chip .v{font-size:17px;font-weight:700;margin-top:3px;}
  .error-msg{color:var(--danger);font-size:14px;margin-top:6px;display:none;}

  /* ===== SENSUS ENTRY ===== */
  .sensus-subnav{display:flex;gap:8px;margin-bottom:14px;}
  .subtab{
    flex:1;padding:11px 0;text-align:center;background:var(--panel);border:1.5px solid var(--line);
    color:var(--dim);font-family:inherit;font-size:14px;letter-spacing:0.3px;border-radius:8px;font-weight:700;
    cursor:pointer;
  }
  .subtab.active{color:#fff;background:var(--dim);border-color:var(--dim);}
  .subtab.resulttab{background:var(--tbs-dim);border-color:var(--tbs);color:var(--tbs);}
  .subtab.resulttab.active{background:var(--tbs);color:#fff;}

  .progress-track{height:8px;background:var(--panel);border-radius:4px;overflow:hidden;margin-bottom:16px;}
  .progress-fill{height:100%;background:var(--tbs);width:0%;transition:width 0.15s;}

  .tree-label{text-align:center;color:var(--dim);font-size:15px;letter-spacing:1px;font-weight:700;}
  .tree-num{text-align:center;font-size:60px;font-weight:700;color:var(--ink);line-height:1.05;margin:2px 0 0;}
  .tree-count{text-align:center;font-size:15px;color:var(--dim);margin-bottom:10px;}
  .tree-count b{color:var(--tbs);font-size:17px;}

  .keypad-wrap{
    flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr 1fr;
    grid-template-areas:"one two" "three four" "zero zero";gap:12px;margin-top:4px;min-height:280px;
  }
  .key{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:2.5px solid var(--line);background:var(--panel);border-radius:16px;cursor:pointer;
  }
  .key:active{transform:scale(0.96);}
  .key .kval{font-size:58px;font-weight:700;line-height:1;}
  .key .klabel{font-size:13px;letter-spacing:0.5px;color:var(--dim);margin-top:6px;font-weight:700;}
  
  .key[data-v="1"]{border-color:#d99584;background:#fbf0ed;}
  .key[data-v="1"] .kval{color:#7a3222;}
  .key[data-v="2"]{border-color:#d9694f;background:#f8ddd4;}
  .key[data-v="2"] .kval{color:#6b1f0f;}
  .key[data-v="3"]{border-color:#c9542f;background:#f5c9bb;}
  .key[data-v="3"] .kval{color:#4c1608;}
  .key[data-v="4"]{border-color:var(--tbs);background:var(--tbs-dim);}
  .key[data-v="4"] .kval{color:var(--tbs);}
  #keyOne{grid-area:one;} #keyTwo{grid-area:two;} #keyThree{grid-area:three;} #keyFour{grid-area:four;}
  
  .key-zero{
    grid-area:zero;display:flex;align-items:center;justify-content:center;gap:16px;
    border:2.5px solid var(--line);background:var(--panel);border-radius:16px;color:var(--dim);cursor:pointer;
  }
  .key-zero:active{transform:scale(0.98);}
  .key-zero .kval{font-size:58px;font-weight:700;color:var(--ink);}
  .key-zero .klabel{font-size:14px;letter-spacing:0.5px;font-weight:700;}

  .entry-nav{display:flex;gap:8px;margin-top:12px;flex-shrink:0;}
  .navbtn{
    flex:1;padding:13px 0;border:1.5px solid var(--line);background:transparent;
    color:var(--dim);font-family:inherit;font-size:14px;letter-spacing:0.5px;border-radius:8px;font-weight:700;cursor:pointer;
  }

  /* ===== TABLES & RESULTS ===== */
  .result-hero{text-align:center;margin-bottom:20px;background:var(--panel);padding:16px;border-radius:12px;border:1.5px solid var(--line);}
  .result-label{font-size:15px;color:var(--dim);letter-spacing:1.5px;font-weight:700;}
  .result-big{font-size:64px;font-weight:700;color:var(--tbs);line-height:1.1;}
  
  .result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
  .res-box{background:var(--panel);border:1.5px solid var(--line);border-radius:10px;padding:12px;}
  .res-box .k{font-size:12px;color:var(--dim);font-weight:700;}
  .res-box .v{font-size:20px;font-weight:700;color:var(--ink);margin-top:4px;}

  table{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px;}
  th, td{border:1px solid var(--line);padding:10px 8px;text-align:center;}
  th{background:var(--panel);font-weight:700;color:var(--dim);}
  tr:nth-child(even){background:#fafafa;}
  
  .gps-status{font-size:11px;font-weight:bold;padding:2px 6px;border-radius:4px;}
  .gps-ok{background:var(--green-dim);color:var(--green);}
  .gps-none{background:var(--tbs-dim);color:var(--tbs);}
</style>
</head>
<body>

  <!-- ==================== SCREEN: HOME ==================== -->
  <div id="screen-home" class="screen active">
    <header>
      <div class="header-text">
        <h1>SENSUS AKP & TAKSASI PANEN</h1>
        <div class="estate-name">Minamas Plantation</div>
      </div>
    </header>
    <main>
      <div class="resume-card">
        <div class="k">DATA AWAL SENSUS</div>
        <div id="home-resume-text" class="v">Lengkapi semua data dulu sebelum mulai sensus.</div>
      </div>
      <button class="btn btn-primary" onclick="switchScreen('screen-setup')">+ SENSUS BARU</button>
      <button class="btn btn-secondary" onclick="bukaRekapData()">LIHAT DATA / REKAP</button>
    </main>
  </div>

  <!-- ==================== SCREEN: SETUP ==================== -->
  <div id="screen-setup" class="screen">
    <header>
      <button class="backbtn" onclick="switchScreen('screen-home')">‹</button>
      <div class="screen-title">Data Awal Sensus</div>
    </header>
    <main>
      <div class="field-group">
        <label class="field-label">KODE FIELD / BLOK</label>
        <input type="text" id="input-field" placeholder="Contoh: A01, B12">
      </div>
      <div class="field-group">
        <label class="field-label">BJR HARI INI (KG)</label>
        <input type="number" id="input-bjr" step="0.1" placeholder="0.00">
      </div>
      <div class="field-group">
        <label class="field-label">TOTAL POKOK DI BLOK (SPH x Luas)</label>
        <input type="number" id="input-total-pokok" placeholder="Contoh: 1500">
      </div>
      <div class="field-group">
        <label class="field-label">LUAS PANEN BESOK (HA)</label>
        <input type="number" id="input-luas-panen" step="0.1" placeholder="0.0">
      </div>
      <button class="btn btn-primary" style="margin-top:12px;" onclick="mulaiSensus()">MULAI SENSUS AKP →</button>
    </main>
  </div>

  <!-- ==================== SCREEN: SENSUS ENTRY ==================== -->
  <div id="screen-sensus" class="screen">
